name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wordpress:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.2'
            php: '7.4'
          - wordpress: '7.1.3'
            php: '8.3'
          - wordpress: '7.1.3'
            php: '8.4'
          - wordpress: '7.1.3'
            php: '8.5'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: hrefscannertests
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      HREF_SCANNER_WP_ROOT: ${{ github.workspace }}/.audit/wordpress
      WP_CLI_CACHE_DIR: ${{ github.workspace }}/.audit/wp-cli-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mysqli
          coverage: none
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Source and package checks
        run: |
          python scripts/check_secrets.py --self-test
          python scripts/check_secrets.py
          find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check admin.js
          node tests/check_admin.js
          python tests/check_release.py
      - name: Install disposable WordPress and the release ZIP
        env:
          WORDPRESS_VERSION: ${{ matrix.wordpress }}
        run: |
          mkdir -p .audit
          curl --fail --location --retry 3 "https://wordpress.org/wordpress-${WORDPRESS_VERSION}.zip" -o .audit/wordpress.zip
          unzip -q .audit/wordpress.zip -d .audit
          curl --fail --location --retry 3 https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o .audit/wp-cli.phar
          echo 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  .audit/wp-cli.phar' | sha256sum --check
          php .audit/wp-cli.phar config create --path="$HREF_SCANNER_WP_ROOT" --dbname=hrefscannertests --dbuser=root --dbhost=127.0.0.1:3306 --dbprefix=hrefscannertest --skip-check
          php .audit/wp-cli.phar config set HREF_SCANNER_TEST_SITE true --raw --path="$HREF_SCANNER_WP_ROOT"
          php .audit/wp-cli.phar config set DISABLE_WP_CRON true --raw --path="$HREF_SCANNER_WP_ROOT"
          php .audit/wp-cli.phar config set WP_HOME http://127.0.0.1:53320 --path="$HREF_SCANNER_WP_ROOT"
          php .audit/wp-cli.phar config set WP_SITEURL http://127.0.0.1:53320 --path="$HREF_SCANNER_WP_ROOT"
          test_password=$(php -r 'echo bin2hex(random_bytes(24));')
          php .audit/wp-cli.phar core install --path="$HREF_SCANNER_WP_ROOT" --url=http://127.0.0.1:53320 --title='href Scanner tests' --admin_user=hrefscannertest --admin_email=tests@example.test --admin_password=$test_password --skip-email
          php .audit/wp-cli.phar plugin install dist/href-scanner-1.0.0.zip --activate --path="$HREF_SCANNER_WP_ROOT"
      - name: Regression checks against the ZIP installation
        run: |
          php tests/check.php
          php tests/check-scan.php
          php tests/check-local-urls.php
          php tests/check-content-types.php
          php tests/check-quick-scan.php
          php tests/check-security.php
          php tests/check-lifecycle.php
      - name: Plugin Check and WordPress Coding Standards
        if: matrix.wordpress == '7.1.3' && matrix.php == '8.3'
        run: |
          php .audit/wp-cli.phar plugin install plugin-check --activate --path="$HREF_SCANNER_WP_ROOT"
          php .audit/wp-cli.phar plugin check href-scanner --format=strict-json --severity=1 --include-experimental --path="$HREF_SCANNER_WP_ROOT"
          php .audit/wp-cli.phar plugin check href-scanner --format=strict-json --severity=1 --include-experimental --path="$HREF_SCANNER_WP_ROOT" --require="$HREF_SCANNER_WP_ROOT/wp-content/plugins/plugin-check/cli.php"
          php "$HREF_SCANNER_WP_ROOT/wp-content/plugins/plugin-check/vendor/bin/phpcs" --standard=.phpcs.xml.dist
